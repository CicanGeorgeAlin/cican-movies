name: Validate CICAN MOVIES

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          set -e
          find . -name "*.js" -not -path "./node_modules/*" -print0 |
            xargs -0 -n1 node --check
      - name: Validate movie filtering and representative playback sources
        run: node scripts/validate-movie-integrity.mjs
