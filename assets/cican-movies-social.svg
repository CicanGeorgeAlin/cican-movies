<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<defs>
  <radialGradient id="bg" cx="50%" cy="8%" r="72%">
    <stop offset="0" stop-color="#151515"/>
    <stop offset=".30" stop-color="#080808"/>
    <stop offset=".72" stop-color="#020202"/>
    <stop offset="1" stop-color="#000"/>
  </radialGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="7" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <radialGradient id="aura">
    <stop stop-color="#fff" stop-opacity=".09"/>
    <stop offset=".68" stop-color="#fff" stop-opacity=".025"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect width="1200" height="630" fill="#000"/>
<rect width="1200" height="630" fill="url(#bg)"/>
<ellipse cx="600" cy="245" rx="470" ry="260" fill="url(#aura)"/>

<g fill="none" stroke="#fff" opacity=".07">
  <ellipse cx="600" cy="235" rx="390" ry="145"/>
  <ellipse cx="600" cy="235" rx="330" ry="118"/>
  <ellipse cx="600" cy="235" rx="270" ry="94"/>
</g>

<g text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" fill="#fff">
  <text x="600" y="154" font-size="28" font-weight="800" letter-spacing="9" opacity=".62">CICAN MOVIES</text>

  <g filter="url(#glow)">
    <text x="600" y="285" font-size="112" font-weight="800" letter-spacing="12">CICAN</text>
  </g>
  <text x="600" y="348" font-size="48" font-weight="700" letter-spacing="22" opacity=".9">MOVIES</text>

  <text x="600" y="414" font-size="42" font-weight="700" letter-spacing="-1.5">Find something to watch.</text>
  <text x="600" y="454" font-size="18" letter-spacing="2.2" opacity=".58">SEARCH • FIND • PLAY</text>

  <rect x="390" y="484" width="420" height="42" rx="0" fill="#070707" stroke="#383838"/>
  <text x="600" y="511" font-size="14" letter-spacing="2.8" opacity=".72">⌕  SEARCH MOVIES</text>

  <text x="600" y="565" font-size="13" font-weight="800" letter-spacing="5" opacity=".48">MOVIES A–Z</text>
  <text x="600" y="594" font-size="15" font-weight="800" letter-spacing="5" opacity=".72">A  B  C  D  E  F  G  H  I  J  K  L  M</text>
</g>
</svg>